name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in progress for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # cairosvg (PNG/PDF export) needs the cairo library
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tile,raster,export]" pytest

      - name: Lint and type check
        run: |
          python -m pip install ruff mypy types-PyYAML
          ruff check src tests docs
          mypy

      - name: Run the tests
        run: python -m pytest

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs,tile]"

      # Executes the gallery examples, so a broken example fails the build.
      # Warnings are not errors yet: the build still has known docstring warnings.
      - name: Build the documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
